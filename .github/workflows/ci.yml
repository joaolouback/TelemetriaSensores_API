# Integração contínua da API: a cada push e PR, roda lint, typecheck,
# os testes de integração (contra um PostgreSQL de verdade) e o build.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uvvgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uvvgo?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uvvgo_test?schema=public
      JWT_SECRET: segredo-apenas-para-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck (código e testes)
        run: npm run typecheck

      - name: Testes de integração
        run: npm test

      - name: Build
        run: npm run build
